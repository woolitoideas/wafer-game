<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>優先表（雲端自動同步）</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --card:#1a1e27; --text:#eef1f6; --muted:#9aa3b2; --accent:#6ea8fe; --border:#2a3140; --ok:#3ecf8e; --bad:#f87171; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6fa; --card:#fff; --text:#1b1f2a; --muted:#667085; --accent:#2563eb; --border:#e4e7ec; --ok:#059669; --bad:#dc2626; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  .hint { color:var(--muted); font-size:0.9rem; margin:0 0 16px; line-height:1.55; }
  .status { font-size:0.85rem; margin:0 0 16px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--muted); }
  .status.ok { color:var(--ok); }
  .status.bad { color:var(--bad); }
  ol#list { list-style:none; padding:0; margin:0 0 16px; display:flex; flex-direction:column; gap:8px; counter-reset:item; }
  li.item { counter-increment:item; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:grab; user-select:none; touch-action:none; }
  li.item:active { cursor:grabbing; }
  li.item.dragging { opacity:0.55; }
  li.item.over { outline:2px solid var(--accent); }
  li.item::before { content:counter(item); width:1.5rem; height:1.5rem; border-radius:999px; background:var(--border); display:grid; place-items:center; font-size:0.8rem; font-weight:600; flex-shrink:0; }
  .tag { margin-left:auto; font-size:0.75rem; color:var(--muted); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { appearance:none; border:0; border-radius:10px; padding:12px 16px; font-size:0.95rem; font-weight:600; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; }
  button.primary:disabled { opacity:0.6; cursor:wait; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .note { font-size:0.8rem; color:var(--muted); width:100%; margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>優先表</h1>
  <p class="hint">拖曳改順序後會自動存到雲端（約 0.4 秒）。換裝置開同一頁即可看到最新順序。本機僅作離線快取。</p>
  <div class="status" id="status">載入雲端中…</div>
  <ol id="list"></ol>
  <div class="actions">
    <button type="button" class="ghost" id="reloadBtn">重新載入雲端</button>
    <button type="button" class="ghost" id="saveBtn">立即儲存</button>
    <span class="note">雲端：受限 JSON API（非 GitHub PAT）。知道此頁網址的人可讀寫此看板。</span>
  </div>
</main>
<script>
const CLOUD_URL = "https://crudcrud.com/api/3fe8676481e24db5a0ff6c1e33ae43fa/priority/6ab37f6a3d1b1003e88ec8e8";
const CACHE_KEY = "grok-priority-board-cloud-v1";
const AUTO_SAVE_MS = 400;
const DEFAULT_TASKS = [
  { name: "跟 Tyson 聊一下", tag: "工作" },
  { name: "回覆芳瑜", tag: "工作" },
  { name: "開桃美館群組", tag: "工作" },
  { name: "Follow 綠色證券", tag: "工作" },
  { name: "公告改名", tag: "工作" }
];

let TASKS = DEFAULT_TASKS.map((t) => ({ ...t }));
let saveTimer = null;
let saving = false;
let pendingAfterSave = false;

const list = document.getElementById("list");
const statusEl = document.getElementById("status");
const saveBtn = document.getElementById("saveBtn");

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.classList.remove("ok", "bad");
  if (kind) statusEl.classList.add(kind);
}

function normalize(arr) {
  return (arr || []).map((t) => ({
    name: String(t.name || t).trim(),
    tag: t.tag ? String(t.tag) : ""
  })).filter((t) => t.name);
}

function cacheWrite() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ tasks: TASKS, savedAt: Date.now() }));
  } catch (_) {}
}

function cacheRead() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return p && Array.isArray(p.tasks) ? normalize(p.tasks) : null;
  } catch (_) {
    return null;
  }
}

function render() {
  list.innerHTML = "";
  TASKS.forEach((t, i) => {
    const li = document.createElement("li");
    li.className = "item";
    li.draggable = true;
    li.dataset.index = String(i);
    li.innerHTML = '<span class="name"></span><span class="tag"></span>';
    li.querySelector(".name").textContent = t.name;
    li.querySelector(".tag").textContent = t.tag || "";
    list.appendChild(li);
  });
}

async function loadCloud() {
  setStatus("載入雲端中…");
  try {
    const res = await fetch(CLOUD_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    TASKS = normalize(data.tasks);
    cacheWrite();
    render();
    setStatus("已從雲端載入" + (data.updatedAt ? "（" + data.updatedAt + "）" : "") + "。拖完會自動存雲端。", "ok");
  } catch (e) {
    const cached = cacheRead();
    if (cached && cached.length) {
      TASKS = cached;
      render();
      setStatus("雲端讀取失敗，已用本機快取。連線後請重新載入。", "bad");
    } else {
      TASKS = DEFAULT_TASKS.map((t) => ({ ...t }));
      render();
      setStatus("雲端讀取失敗，顯示預設清單。", "bad");
    }
  }
}

async function saveCloud(opts) {
  const quiet = opts && opts.quiet;
  if (saving) {
    pendingAfterSave = true;
    return;
  }
  saving = true;
  saveBtn.disabled = true;
  if (!quiet) setStatus("正在寫入雲端…");
  else setStatus("正在自動存雲端…");
  const payload = {
    updatedAt: new Date().toISOString(),
    tasks: TASKS
  };
  try {
    const res = await fetch(CLOUD_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok && res.status !== 200 && res.status !== 204) {
      throw new Error("HTTP " + res.status);
    }
    cacheWrite();
    setStatus("已自動存雲端", "ok");
  } catch (e) {
    cacheWrite();
    setStatus("雲端寫入失敗：" + (e && e.message ? e.message : e) + "。已暫存本機。", "bad");
  } finally {
    saving = false;
    saveBtn.disabled = false;
    if (pendingAfterSave) {
      pendingAfterSave = false;
      scheduleAutoSave();
    }
  }
}

function scheduleAutoSave() {
  if (saveTimer) clearTimeout(saveTimer);
  setStatus("順序已改，稍後自動存雲端…");
  saveTimer = setTimeout(() => {
    saveTimer = null;
    saveCloud({ quiet: true });
  }, AUTO_SAVE_MS);
}

let dragIndex = null;
list.addEventListener("dragstart", (e) => {
  const li = e.target.closest("li.item");
  if (!li) return;
  dragIndex = Number(li.dataset.index);
  li.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
});
list.addEventListener("dragend", (e) => {
  const li = e.target.closest("li.item");
  if (li) li.classList.remove("dragging");
  list.querySelectorAll(".over").forEach((n) => n.classList.remove("over"));
  dragIndex = null;
});
list.addEventListener("dragover", (e) => {
  e.preventDefault();
  const li = e.target.closest("li.item");
  if (!li || dragIndex === null) return;
  list.querySelectorAll(".over").forEach((n) => n.classList.remove("over"));
  li.classList.add("over");
});
list.addEventListener("drop", (e) => {
  e.preventDefault();
  const li = e.target.closest("li.item");
  if (!li || dragIndex === null) return;
  const to = Number(li.dataset.index);
  if (to === dragIndex) return;
  const [moved] = TASKS.splice(dragIndex, 1);
  TASKS.splice(to, 0, moved);
  cacheWrite();
  render();
  scheduleAutoSave();
});

document.getElementById("saveBtn").addEventListener("click", () => {
  if (saveTimer) {
    clearTimeout(saveTimer);
    saveTimer = null;
  }
  saveCloud({ quiet: false });
});
document.getElementById("reloadBtn").addEventListener("click", loadCloud);

loadCloud();
</script>
</body>
</html>
